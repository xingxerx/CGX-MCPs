services:
  serena:
    image: serena:latest
    container_name: cgx-serena
    build:
      context: ./serena
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      # Repos to analyse — must be mounted for Serena to access them
      - /d/SYNOID:/workspace/SYNOID
      - /d/Qallow:/workspace/Qallow
      # Persist Serena config and session logs across restarts
      - ./serena-config:/workspaces/serena/config
    ports:
      - "9121:9121" # MCP SSE endpoint
      - "24282:24282" # Web dashboard  http://localhost:24282/dashboard
    environment:
      - SERENA_DOCKER=1
    command:
      - "uv run --directory . serena-mcp-server --transport sse --port 9121 --host 0.0.0.0 --context claude-code"
